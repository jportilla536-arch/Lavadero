name: Keep Alive Backend & DB

on:
  schedule:
    # Cada 14 minutos (Render se suspende a los 15 minutos de inactividad)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend health endpoint..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" -m 60 "https://lavadero-s88q.onrender.com/health")
          echo "$response"
